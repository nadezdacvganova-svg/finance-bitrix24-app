openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project finance operations
  - name: transactions
    description: Income and expense operations
  - name: categories
    description: Finance categories
  - name: integrations
    description: Integration placeholders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects with finance summaries
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: Project already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with transactions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: List project employees
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectMember
      tags: [projects]
      summary: Add an employee to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberInput"
      responses:
        "201":
          description: Added employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}/members/{memberId}:
    delete:
      operationId: deleteProjectMember
      tags: [projects]
      summary: Remove an employee from a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Employee removed
        "404":
          description: Employee or project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions:
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Add income or expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List recent transactions
      parameters:
        - in: query
          name: projectId
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
  /transactions/{transactionId}:
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Transaction deleted
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List income and expense categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a finance category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          description: Category already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/bitrix24:
    get:
      operationId: getBitrixStatus
      tags: [integrations]
      summary: Get Bitrix24 integration status
      responses:
        "200":
          description: Current integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BitrixStatus"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        totalIncome:
          type: number
        totalExpenses:
          type: number
        profit:
          type: number
        profitability:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
      required:
        - id
        - name
        - createdAt
        - totalIncome
        - totalExpenses
        - profit
        - profitability
        - transactions
        - members
    ProjectMemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    ProjectMember:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, name, createdAt]
    TransactionInput:
      type: object
      properties:
        projectId:
          type: string
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
          minLength: 1
        amount:
          type: number
          exclusiveMinimum: 0
        description:
          type: string
        transactionDate:
          type: string
          format: date
      required: [projectId, type, category, amount]
    Transaction:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: string
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
        description:
          type: string
        transactionDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - type
        - category
        - amount
        - description
        - transactionDate
        - createdAt
    CategoryInput:
      type: object
      properties:
        type:
          type: string
          enum: [income, expense]
        name:
          type: string
          minLength: 1
      required: [type, name]
    Category:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [income, expense]
        name:
          type: string
      required: [id, type, name]
    BitrixStatus:
      type: object
      properties:
        connected:
          type: boolean
        message:
          type: string
      required: [connected, message]

